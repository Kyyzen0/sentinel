name: Package

# Construction manuelle des binaires (PyInstaller). Pas à chaque push :
# l'extra [gui] et le gel Qt sont lourds.
#
# Artefacts non signés, sur les trois systèmes. La signature Developer ID
# et la notarisation se font sur le Mac du mainteneur
# (docs/signature-macos.md). Ce workflow ne lit aucun secret Apple.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[gui,bundle]"

      - name: Build
        run: python packaging/build.py

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentinel-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

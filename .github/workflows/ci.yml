name: CI

# Minutes : Windows compte ×2, macOS ×10. La matrice chère ne part que
# lorsque le code va vraiment être intégré.
#
# À chaque pull request (brouillon compris) et à chaque push : Ubuntu
# 3.10 et 3.13, plus le job GUI Linux (PyInstaller inclus). Ubuntu 3.11
# et 3.12 complètent la matrice Linux sur un push vers main et sur
# workflow_dispatch. Windows 3.12, macOS 3.12 et les GUI Windows/macOS
# ne partent que sur un push vers main, un workflow_dispatch, ou une
# pull request qui n'est plus un brouillon (ready_for_review, puis
# chaque synchronize tant que draft == false).
#
# Les jobs sont séparés parce que `matrix` n'est pas disponible dans
# l'if d'un job : un if qui lirait matrix.os lancerait quand même le
# runner. Les étapes de chaque copie sont celles d'origine.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            coverage: false
          - os: ubuntu-latest
            python-version: "3.13"
            coverage: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check sentinel/ tests/ packaging/
          ruff format --check sentinel/ tests/ packaging/

      - name: Typecheck (mypy)
        run: mypy

      - name: Run tests
        if: matrix.coverage != true
        run: python -m unittest discover -s tests -v

      - name: Run tests with coverage
        if: matrix.coverage == true
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
          coverage xml

      - name: Upload coverage to Codecov
        if: matrix.coverage == true
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  test-full:
    name: test-${{ matrix.os }}-py${{ matrix.python-version }}
    # Push limité à main, donc ceci = push main ou workflow_dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            coverage: false
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check sentinel/ tests/ packaging/
          ruff format --check sentinel/ tests/ packaging/

      - name: Typecheck (mypy)
        run: mypy

      - name: Run tests
        if: matrix.coverage != true
        run: python -m unittest discover -s tests -v

      - name: Run tests with coverage
        if: matrix.coverage == true
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
          coverage xml

      - name: Upload coverage to Codecov
        if: matrix.coverage == true
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  test-desktop:
    name: test-${{ matrix.os }}-py${{ matrix.python-version }}
    # Hors pull_request, github.event.pull_request est null.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.12"
            coverage: false
          - os: windows-latest
            python-version: "3.12"
            coverage: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check sentinel/ tests/ packaging/
          ruff format --check sentinel/ tests/ packaging/

      - name: Typecheck (mypy)
        run: mypy

      - name: Run tests
        if: matrix.coverage != true
        run: python -m unittest discover -s tests -v

      - name: Run tests with coverage
        if: matrix.coverage == true
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
          coverage xml

      - name: Upload coverage to Codecov
        if: matrix.coverage == true
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  gui:
    name: gui-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install package + GUI
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,gui]"

      - name: Core suite
        run: python -m unittest discover -s tests -v

      - name: GUI tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_gui.py -q

      - name: PyInstaller smoke
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python -m pip install -e ".[gui,bundle]"
          python packaging/build.py
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="dist/sentinel/sentinel.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            bin="dist/Sentinel.app/Contents/MacOS/sentinel"
          else
            bin="dist/sentinel/sentinel"
          fi
          "$bin" --self-check
          "$bin" --version

  gui-desktop:
    name: gui-${{ matrix.os }}
    # Hors pull_request, github.event.pull_request est null.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install package + GUI
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,gui]"

      - name: Core suite
        run: python -m unittest discover -s tests -v

      - name: GUI tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_gui.py -q

      - name: PyInstaller smoke
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python -m pip install -e ".[gui,bundle]"
          python packaging/build.py
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="dist/sentinel/sentinel.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            bin="dist/Sentinel.app/Contents/MacOS/sentinel"
          else
            bin="dist/sentinel/sentinel"
          fi
          "$bin" --self-check
          "$bin" --version
